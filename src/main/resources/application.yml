spring:
  application:
    name: reberu
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reberu}
    username: ${DB_USERNAME:reberu}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration/core,classpath:db/migration/vendor/{vendor}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
            redirect-uri: ${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/google
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: false
      staleness:
        published: 10m
        processing: 10m
        resubmitted: 10m
        check-interval: 1m

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: true
  observations:
    enable:
      spring.security: false
  metrics:
    enable:
      disk: false
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

reberu:
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    version: ${APP_VERSION:0.0.0}
    min-version: ${APP_MIN_VERSION:0.0.0}
  audit:
    retention: ${ACTIVITY_LOG_RETENTION:365d}
  cursor:
    signing-key: ${CURSOR_SIGNING_KEY}
  events:
    retention: ${EVENT_PUBLICATION_RETENTION:30d}
    retry:
      intervals: 1m, 5m, 30m, 2h, 12h
      check-interval: PT30S
  rate-limit:
    max-keys-per-rule: ${RATE_LIMIT_MAX_KEYS_PER_RULE:100000}
    rules:
      login: { limit: "${RATE_LIMIT_LOGIN:20}", window: 1m }
      invite-link: { limit: "${RATE_LIMIT_INVITE_LINK:10}", window: 1m }
      invitation: { limit: "${RATE_LIMIT_INVITATION:200}", window: 1h }
      join-request: { limit: "${RATE_LIMIT_JOIN_REQUEST:10}", window: 1d }
      org-create: { limit: "${RATE_LIMIT_ORG_CREATE:3}", window: 1d }
      public-org-search: { limit: "${RATE_LIMIT_PUBLIC_ORG_SEARCH:30}", window: 1m }
      posting: { limit: "${RATE_LIMIT_POSTING:30}", window: 1m }
      default: { limit: "${RATE_LIMIT_DEFAULT:300}", window: 1m }
    failure-streaks:
      invite-link: { threshold: "${RATE_LIMIT_INVITE_LINK_FAILURES:20}", block: 15m }
  operator:
    account-ids: ${OPERATOR_ACCOUNT_IDS:}
  legal:
    terms-version: ${TERMS_VERSION:v1}
    privacy-version: ${PRIVACY_VERSION:v1}
  session:
    idle-timeout: ${SESSION_IDLE_TIMEOUT:8h}
    max-lifetime: ${SESSION_MAX_LIFETIME:7d}
    max-per-account: ${SESSION_MAX_PER_ACCOUNT:10}
    recent-auth-window: 1h
  tenancy:
    mode: ${DEPLOYMENT_MODE:MULTI_ORG}
    invite-link-failure-delay: 300ms
    request-cooldown: 7d
    guest-expiry-interval: PT10M
    single-org:
      name: ${SINGLE_ORG_NAME:}
      time-zone: ${SINGLE_ORG_TIME_ZONE:}
      admin-email: ${SINGLE_ORG_ADMIN_EMAIL:}
    banned-words:
      - reberu
      - 레베루
      - 운영자
      - 관리자
      - 공식
      - 운영진
      - admin
      - administrator
      - official
      - operator
      - moderator
