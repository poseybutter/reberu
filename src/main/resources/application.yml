spring:
  application:
    name: reberu
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reberu}
    username: ${DB_USERNAME:reberu}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration/core,classpath:db/migration/vendor/{vendor}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
            redirect-uri: ${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/google
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

reberu:
  app:
    version: ${APP_VERSION:0.0.0}
    min-version: ${APP_MIN_VERSION:0.0.0}
  audit:
    retention: ${ACTIVITY_LOG_RETENTION:365d}
  cursor:
    signing-key: ${CURSOR_SIGNING_KEY}
  legal:
    terms-version: ${TERMS_VERSION:v1}
    privacy-version: ${PRIVACY_VERSION:v1}
  session:
    idle-timeout: ${SESSION_IDLE_TIMEOUT:8h}
    max-lifetime: ${SESSION_MAX_LIFETIME:7d}
    max-per-account: ${SESSION_MAX_PER_ACCOUNT:10}
    recent-auth-window: 1h
  tenancy:
    mode: ${DEPLOYMENT_MODE:MULTI_ORG}
    single-org:
      name: ${SINGLE_ORG_NAME:}
      time-zone: ${SINGLE_ORG_TIME_ZONE:}
      admin-email: ${SINGLE_ORG_ADMIN_EMAIL:}
    banned-words:
      - reberu
      - 레베루
      - 운영자
      - 관리자
      - 공식
      - 운영진
      - admin
      - administrator
      - official
      - operator
      - moderator
