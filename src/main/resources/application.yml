spring:
  application:
    name: reberu
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reberu}
    username: ${DB_USERNAME:reberu}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/core,classpath:db/migration/vendor/{vendor}
  modulith:
    detection-strategy: explicitly-annotated
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

reberu:
  app:
    version: ${APP_VERSION:0.0.0}
    min-version: ${APP_MIN_VERSION:0.0.0}
  cursor:
    signing-key: ${CURSOR_SIGNING_KEY}
  session:
    idle-timeout: ${SESSION_IDLE_TIMEOUT:8h}
    max-lifetime: ${SESSION_MAX_LIFETIME:7d}
    max-per-account: ${SESSION_MAX_PER_ACCOUNT:10}
