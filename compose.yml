services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reberu
      POSTGRES_USER: reberu
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정하세요}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reberu -d reberu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
