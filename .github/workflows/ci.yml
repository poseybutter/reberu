name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 테스트와 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "17"

      # Gradle 캐시를 관리하고 gradle-wrapper.jar가 공식 배포본인지 검증한다.
      - uses: gradle/actions/setup-gradle@v6

      # Testcontainers는 러너에 설치된 Docker를 사용한다. 비밀값은 필요 없다.
      - run: ./gradlew test bootJar

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
