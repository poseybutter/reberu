name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 테스트와 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "17"

      # Gradle 캐시 관리와 wrapper jar 검증
      - uses: gradle/actions/setup-gradle@v6

      # 러너 Docker로 Testcontainers 실행, 비밀값 불필요
      - run: ./gradlew test bootJar

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
