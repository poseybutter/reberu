name: 버그
description: 잘못된 동작을 알립니다.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 어떤 문제가 있는지 한두 문장으로 적습니다.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 문제를 다시 일으키는 순서를 적습니다.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 현재 동작
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 확인되면 이 이슈를 닫을 수 있는지 적습니다.
      placeholder: "- [ ] 재현 방법대로 했을 때 기대 동작이 나온다"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 중요도
      options:
        - 높음
        - 보통
        - 낮음
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: 규모
      options:
        - S (반나절 이하)
        - M (하루 정도)
        - L (이틀 이상)
    validations:
      required: true
