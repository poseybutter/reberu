name: 기술 작업
description: 리팩터링, 테스트, 문서, CI, 빌드 설정처럼 기능이 아닌 작업입니다.
title: "type: "
body:
  - type: markdown
    attributes:
      value: 제목 앞의 `type:`을 아래에서 고른 작업 타입(refactor, test, docs, ci, chore)으로 바꿔 주세요. 라벨은 같은 이름으로 직접 붙입니다.
  - type: dropdown
    id: type
    attributes:
      label: 작업 타입
      options:
        - refactor
        - test
        - docs
        - ci
        - chore
    validations:
      required: true
  - type: checkboxes
    id: title-check
    attributes:
      label: 제목 확인
      options:
        - label: 제목의 `type:`을 고른 작업 타입으로 바꿨다
          required: true
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 이 작업이 왜 필요한지 적습니다.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 내용
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: "- [ ] "
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 중요도
      options:
        - 높음
        - 보통
        - 낮음
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: 규모
      options:
        - S (반나절 이하)
        - M (하루 정도)
        - L (이틀 이상)
    validations:
      required: true
